<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NID Parser API</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid #1e293b; background: #111c33;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: #34d399; border: 1px solid #14532d; background: #052e1b;
    padding: 3px 7px; border-radius: 999px;
  }
  nav { margin-left: auto; display: flex; gap: 8px; font-size: 13px; }
  nav a {
    color: #cbd5e1; text-decoration: none; padding: 6px 10px;
    border: 1px solid #253449; border-radius: 6px;
  }
  nav a:hover { background: #1b2a44; color: #fff; }
  main { flex: 1; min-height: 0; background: #fff; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <header>
    <h1>NID Parser API</h1>
    <span class="tag">dev preview</span>
    <nav>
      <a href="/health">Health</a>
      <a href="/docs" target="_top">Open docs</a>
    </nav>
  </header>
  <main>
    <iframe src="/docs" title="API documentation"></iframe>
  </main>
</body>
</html>
